name: Secret scanning

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan full history and every ref
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pull request refs
        # actions/checkout does not fetch refs/pull/*. Fetch them so PR head commits are scanned too.
        run: git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pr/*' || true

      - name: Scan every branch, tag and pull-request ref
        # --log-opts=--all makes gitleaks walk every ref it has, not only the checked-out branch.
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --config /repo/.gitleaks.toml \
            --log-opts="--all" --redact --verbose --exit-code 1
