<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Student sign in — trayUP</title>
<link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/student.css"><link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="student-page">
<div id="app-header"></div>
<main class="container" style="max-width:460px;padding-top:28px">
  <h1>Student account</h1>
  <p style="color:var(--muted);margin:12px 0 20px">Sign in or create a student account to browse the menu, place orders, and track them.</p>

  <section class="card">
    <div class="auth-tabs" role="tablist">
      <button type="button" role="tab" id="tab-login" aria-selected="true" aria-controls="login-form">Log in</button>
      <button type="button" role="tab" id="tab-register" aria-selected="false" aria-controls="register-form">Create account</button>
    </div>

    <form id="login-form" novalidate>
      <div class="field"><label for="login-email">Email</label><input id="login-email" type="email" required autocomplete="username"></div>
      <div class="field"><label for="login-password">Password</label><input id="login-password" type="password" required autocomplete="current-password"></div>
      <button class="btn btn-primary" type="submit" style="width:100%">Log in</button>
    </form>

    <form id="register-form" novalidate hidden>
      <div class="field"><label for="register-name">Full name</label><input id="register-name" required autocomplete="name" maxlength="100"></div>
      <div class="field"><label for="register-email">Email</label><input id="register-email" type="email" required autocomplete="email" maxlength="120"></div>
      <div class="field"><label for="register-password">Password (at least 8 characters)</label><input id="register-password" type="password" required autocomplete="new-password" minlength="8" maxlength="128"></div>
      <button class="btn btn-primary" type="submit" style="width:100%">Create account</button>
      <p style="color:var(--muted);font-size:13px;margin-top:12px;line-height:1.45">Your account details help identify your orders and receipts.</p>
    </form>
  </section>
</main>
<script src="../shared/config.js"></script><script src="../shared/storage.js"></script><script src="../shared/api.js"></script><script src="../shared/auth.js"></script><script src="../shared/notifications.js"></script><script src="../shared/components.js"></script><script src="../shared/validation.js"></script>
<script src="./js/student-login.js"></script>
</body>
</html>
