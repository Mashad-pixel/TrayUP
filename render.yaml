services:
  - type: web
    name: trayup-mashad-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app wsgi:app db upgrade
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: trayup-postgres
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      - key: FIREBASE_ENABLED
        value: "true"
      - key: FIREBASE_DATABASE_URL
        value: https://trayup-36abb-default-rtdb.asia-southeast1.firebasedatabase.app/
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        value: /etc/secrets/serviceAccountKey.json
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

databases:
  - name: trayup-postgres
    databaseName: trayup
    user: trayup
    plan: free
    region: singapore
