<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Login — trayUP</title><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/admin-panel.css"><link rel="stylesheet" href="../css/admin.css"></head><body><main class="login-shell"><form class="login-card" id="login-form"><a class="brand" href="../index.html"><span class="brand-mark"></span><span>trayUP</span></a><h1>Admin sign in</h1><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn btn-primary" type="submit">Sign in</button></form><form class="login-card" id="mfa-form" hidden><h1>Two-factor code</h1><p>Enter the 6-digit code from your authenticator app.</p><div class="field"><label for="mfa-code">Code</label><input id="mfa-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,8}" maxlength="8" required></div><button class="btn btn-primary" type="submit">Verify</button><p><a href="./login.html">Start over</a></p></form><form class="login-card" id="mfa-setup-form" hidden><h1>Set up two-factor</h1><p>Administrator accounts need an authenticator app. Add this key to your app, then enter a code to finish.</p><div class="field"><label>Setup key</label><code id="mfa-secret" style="word-break:break-all"></code></div><p><a id="mfa-link" href="#" hidden>Open in an authenticator app</a></p><div class="field"><label for="setup-code">Code from your app</label><input id="setup-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,8}" maxlength="8" required></div><button class="btn btn-primary" type="submit">Turn on two-factor</button></form></main><script src="../shared/config.js"></script><script src="../shared/storage.js"></script><script src="../shared/mode.js"></script><script src="../shared/api.js"></script><script src="../shared/auth.js"></script><script src="../shared/validation.js"></script><script src="../shared/notifications.js"></script><script src="../shared/admin-panel.js"></script><script src="./js/login.js"></script></body></html>
