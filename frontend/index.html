<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>TrayUP — College Canteen</title>
  <link rel="stylesheet" href="./css/global.css?v=premium-static-doodle-v3">
  <link rel="stylesheet" href="./css/components.css?v=diet-filter-v1">
  <link rel="stylesheet" href="./css/student.css?v=diet-filter-v1">
  <link rel="stylesheet" href="./css/responsive.css?v=diet-filter-v1">
</head>
<body class="student-page">
  <div id="app-header"></div>
  <main>
    <section class="menu-hero" aria-label="Popular dishes" aria-roledescription="carousel">
      <div class="hero-viewport">
        <div class="hero-track" id="hero-track" aria-live="off"></div>
      </div>
      <div class="hero-controls" aria-label="Popular dish slides">
        <button type="button" id="hero-previous" aria-label="Show previous popular dish">&lt;</button>
        <span id="hero-slide-count" aria-hidden="true"></span>
        <button type="button" id="hero-next" aria-label="Show next popular dish">&gt;</button>
      </div>
    </section>

    <section class="menu-catalog" id="popular">
      <div class="popular-periods" id="popular-periods" aria-label="Popular foods time period" hidden>
        <span>Top ordered</span>
        <button type="button" class="active" data-period="day">Today</button>
        <button type="button" data-period="week">This week</button>
        <button type="button" data-period="month">This month</button>
      </div>
      <div class="menu-filters">
        <select id="availability-filter" aria-label="Filter by availability">
          <option value="all">All availability</option>
          <option value="available">Available now</option>
        </select>
        <select id="diet-filter" aria-label="Filter by dietary preference">
          <option value="all">All diets</option>
          <option value="veg">Veg</option>
          <option value="nonveg">Non-veg</option>
          <option value="egg">Egg</option>
        </select>
        <button class="btn btn-secondary" id="clear-search" type="button">Clear search</button>
      </div>
      <div class="menu-heading">
        <h2>Popular today</h2>
        <p>Freshly prepared at the campus canteen</p>
      </div>
      <div class="food-grid" id="food-grid" aria-live="polite"></div>
    </section>
  </main>

  <aside class="cart-drawer" id="cart-drawer" aria-label="Shopping cart">
    <div class="cart-head">
      <strong>Your order</strong>
      <button class="icon-btn" id="close-cart" type="button" aria-label="Close cart">✕</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-foot">
      <div class="cart-total"><span>Subtotal</span><strong id="cart-total">₹0</strong></div>
      <a class="btn btn-primary" href="./student/checkout.html">Checkout</a>
    </div>
  </aside>

  <script src="./shared/config.js"></script>
  <script src="./shared/storage.js"></script>
  <script src="./shared/api.js"></script>
  <script src="./shared/notifications.js"></script>
  <script src="./shared/components.js?v=static-doodles-v1"></script>
  <script src="./shared/demo-data.js?v=diet-filter-v1"></script>
  <script src="./student/js/menu.js?v=diet-filter-v1"></script>
</body>
</html>
