<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Cart — trayUP</title><link rel="stylesheet" href="../css/global.css?v=customer-design-system-v8"><link rel="stylesheet" href="../css/components.css?v=customer-design-system-v8"><link rel="stylesheet" href="../css/student.css?v=customer-design-system-v8"><link rel="stylesheet" href="../css/responsive.css?v=customer-design-system-v8"></head>
<body class="student-page">
<div id="app-header"></div>
<main class="container customer-page customer-cart-page">
  <header class="customer-page-heading">
    <p class="eyebrow">YOUR TRAY</p>
    <h1>Your order</h1>
    <p>Review your dishes and quantities before checkout.</p>
  </header>
  <div id="cart-list" class="cart-page-list" aria-live="polite"></div>
  <div class="cart-foot cart-page-foot" id="cart-foot" hidden>
    <div class="cart-total"><span>Subtotal</span><strong id="cart-total">₹0</strong></div>
    <button class="btn btn-secondary" id="clear-cart" type="button">Clear cart</button>
    <a class="btn btn-primary" href="./checkout.html">Continue to checkout</a>
  </div>
</main>
<script src="../shared/config.js"></script><script src="../shared/storage.js"></script><script src="../shared/components.js?v=featured-nav-v1"></script><script src="../shared/notifications.js"></script>
<script>
document.getElementById("app-header").innerHTML=trayComponents.header();
function escapeHtml(value){
 return String(value??"").replace(/[&<>"']/g,character=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[character]));
}
function renderCart(){
 const cart=trayStorage.get("trayup-cart",[]);
 const total=cart.reduce((n,i)=>n+i.price*i.qty,0);
 const cartCount=document.getElementById("cart-count");
 if(cartCount)cartCount.textContent=cart.reduce((sum,item)=>sum+Number(item.qty||0),0);
 document.getElementById("cart-total").textContent="₹"+total.toLocaleString("en-IN");
 document.getElementById("cart-foot").hidden=!cart.length;
 document.getElementById("cart-list").innerHTML=cart.length?cart.map(i=>`
 <article class="cart-page-item">
   <img src="${escapeHtml(i.image||"")}" alt="" loading="lazy" onerror="this.style.display='none';this.parentElement.classList.add('cart-item-image-fallback')">
   <div class="cart-page-item-info"><strong>${escapeHtml(i.name)}</strong><span class="cart-page-unit-price">₹${Number(i.price).toLocaleString("en-IN")} each</span>
     <div class="qty-control">
       <button type="button" data-delta="-1" data-id="${Number(i.id)}" aria-label="Remove one ${escapeHtml(i.name)}">−</button>
       <span aria-live="polite">${Number(i.qty)||0}</span>
       <button type="button" data-delta="1" data-id="${Number(i.id)}" aria-label="Add one ${escapeHtml(i.name)}">+</button>
     </div>
   </div>
   <div class="cart-page-line-total"><strong>₹${(Number(i.price)*Number(i.qty)).toLocaleString("en-IN")}</strong><button type="button" data-remove="${Number(i.id)}">Remove</button></div>
 </article>`).join(""):`<div class="empty-state cart-empty-state"><span class="cart-empty-icon" aria-hidden="true">＋</span><h2>Your cart is empty</h2><p>Choose something fresh from the menu to get started.</p><a class="btn btn-primary" href="../index.html">Browse the menu</a></div>`;
}
document.getElementById("cart-list").addEventListener("click",e=>{
 const cart=trayStorage.get("trayup-cart",[]);
 const qtyButton=e.target.closest("[data-delta]");
 const removeButton=e.target.closest("[data-remove]");
 if(qtyButton){const item=cart.find(i=>i.id===Number(qtyButton.dataset.id));if(item){item.qty+=Number(qtyButton.dataset.delta);trayStorage.set("trayup-cart",cart.filter(i=>i.qty>0));renderCart();}}
 if(removeButton){trayStorage.set("trayup-cart",cart.filter(i=>i.id!==Number(removeButton.dataset.remove)));trayNotify("Item removed");renderCart();}
});
document.getElementById("clear-cart").addEventListener("click",()=>{
 trayStorage.remove("trayup-cart");
 trayNotify("Cart cleared");
 renderCart();
});
renderCart();
</script>
</body></html>
