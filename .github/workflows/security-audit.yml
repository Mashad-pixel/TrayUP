name: Security and test checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install application and audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit
      - name: Run application tests
        run: pytest -q
      - name: Audit resolved Python dependencies
        run: pip-audit --strict -r requirements.txt
      - name: Run Python security linter
        run: bandit -q -r app
      - name: Install frontend behaviour-test dependencies
        working-directory: tests/frontend
        run: npm install --no-audit --no-fund
      - name: Run frontend behaviour tests
        working-directory: tests/frontend
        run: npm test
      - name: Check JavaScript syntax
        run: |
          find frontend tests/frontend -type f -name '*.js' -print0 | xargs -0 -n1 node --check
