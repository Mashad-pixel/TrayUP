<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Checkout — trayUP</title><link rel="stylesheet" href="../css/global.css?v=premium-static-doodle-v3"><link rel="stylesheet" href="../css/components.css?v=scattered-doodle-v1"><link rel="stylesheet" href="../css/student.css?v=checkout-professional-v2"><link rel="stylesheet" href="../css/responsive.css?v=scattered-doodle-v1"><link rel="stylesheet" href="../css/admin.css"></head>
<body class="student-page">
<div id="app-header"></div>
<main class="container" style="max-width:900px;padding:36px 0">
<h1 style="font-family:var(--serif);font-size:42px;font-weight:400;margin-bottom:20px">Checkout</h1>
<div class="checkout-layout">
<form id="checkout-form" class="card" style="padding:24px" novalidate>
<h2 style="font-size:18px;margin-bottom:16px">Student details</h2>
<div class="field"><label for="name">Name</label><input id="name" name="name" required autocomplete="name"></div>
<div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" required autocomplete="tel" aria-describedby="phone-error"><small id="phone-error" class="field-error" role="alert" hidden>Number is invalid</small></div>
<div class="field"><label for="instructions">Special instructions</label><textarea id="instructions" name="instructions" rows="3" placeholder="Less spicy, no onion…"></textarea></div>
<button class="btn btn-primary" id="checkout-submit-btn" type="submit" style="width:100%;margin-top:16px;padding:14px;font-size:16px;font-weight:600" disabled>Pay Now</button>
<section id="upi-payment-panel" class="upi-payment-panel" aria-live="polite" hidden>
  <h2 style="font-size:20px;margin-bottom:8px">Complete Payment</h2>
  <p id="upi-order-summary" style="font-size:15px;font-weight:600;margin-bottom:14px"></p>
  <div style="margin:14px 0">
    <a class="btn btn-primary" id="open-upi" style="display:block;text-align:center;text-decoration:none;font-size:16px;padding:13px 16px;font-weight:700;border-radius:10px">
      ⚡ Open UPI App (GPay / PhonePe / Paytm)
    </a>
    <p style="text-align:center;font-size:12px;color:var(--muted);margin-top:6px">Tap to choose which UPI app to pay with</p>
  </div>
  <div class="upi-qr-container" style="border:1px solid var(--line);border-radius:12px;padding:16px">
    <img id="upi-qr" alt="Scan this QR code with your UPI app to pay">
    <p style="margin-top:10px;font-weight:500">Or scan this QR code with any UPI app</p>
  </div>
  <label class="field" for="utr-number" style="margin-top:16px">UPI Reference / UTR Number <small>(optional)</small>
    <input id="utr-number" type="text" maxlength="12" autocomplete="off" placeholder="12-digit UPI reference ID">
  </label>
  <button class="btn btn-primary" id="submit-payment-claim" type="button" style="width:100%;margin-top:8px">I Have Paid</button>
  <div id="sandbox-dev-container" style="margin-top:14px;text-align:center" hidden>
    <button type="button" id="sandbox-pay-btn" class="btn btn-secondary" style="font-size:12px;padding:6px 12px;opacity:0.85">⚡ Test with Sandbox Simulator (Dev)</button>
  </div>
  <p id="upi-payment-message" role="status" aria-live="polite"></p>
</section>
</form>
<aside class="card checkout-summary" style="padding:20px;height:max-content"><h2 style="font-size:16px">Order summary</h2><div id="summary" style="margin:16px 0"></div><div class="cart-total"><span>Total</span><strong id="checkout-total">₹0</strong></div><p id="total-note" style="color:var(--muted);font-size:13px;margin-top:8px"></p><h3 class="checkout-food-heading">Your food</h3><div id="summary-food-images" class="checkout-food-images" aria-label="Photos of foods in your order"></div></aside>
</div></main>
<script src="../shared/config.js"></script><script src="../shared/storage.js"></script><script src="../shared/api.js"></script><script src="../shared/notifications.js"></script><script src="../shared/components.js?v=static-doodles-v1"></script><script src="../shared/validation.js"></script><script src="../shared/demo-data.js?v=product-page-v2"></script>
<script src="./js/payment.js?v=upi-sandbox-v1"></script>
<script src="./js/checkout.js?v=upi-sandbox-v1"></script>
</body></html>
